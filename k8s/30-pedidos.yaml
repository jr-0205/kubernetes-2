apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      containers:
        - name: pedidos
          image: tienda-pedidos:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: CLIENTES_URL
              value: http://clientes:5000
            - name: PRODUCTOS_URL
              value: http://productos:5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 160Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos
  namespace: tienda
spec:
  type: ClusterIP
  selector:
    app: pedidos
  ports:
    - name: http
      port: 5000
      targetPort: http
