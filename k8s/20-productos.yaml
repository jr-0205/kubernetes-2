apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productos
  template:
    metadata:
      labels:
        app: productos
    spec:
      containers:
        - name: productos
          image: tienda-productos:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: productos
  namespace: tienda
spec:
  type: ClusterIP
  selector:
    app: productos
  ports:
    - name: http
      port: 5000
      targetPort: http
