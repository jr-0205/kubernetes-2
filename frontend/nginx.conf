server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    location = /api/clientes {
        proxy_pass http://clientes:5000/clientes;
    }
    location /api/clientes/ {
        proxy_pass http://clientes:5000/clientes/;
    }
    location = /api/productos {
        proxy_pass http://productos:5000/productos;
    }
    location /api/productos/ {
        proxy_pass http://productos:5000/productos/;
    }
    location = /api/pedidos {
        proxy_pass http://pedidos:5000/pedidos;
    }
    location /api/pedidos/ {
        proxy_pass http://pedidos:5000/pedidos/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
